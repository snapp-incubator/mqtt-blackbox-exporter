---
version: "2"
linters:
  default: all
  disable:
    - depguard
    # we don't use json with camel-case
    - tagliatelle
    - nolintlint
    # it should improve to support more known patterns
    - varnamelen
    - ireturn
    - revive
    - wrapcheck
    - gosec
    # superseded by wsl_v5, gomodguard_v2 and exhaustruct_v5, all already on via `default: all`
    - wsl
    - gomodguard
    - exhaustruct
